version: 2
updates:
  # oxlint (pinned in each workspace's package.json, which can't hold a comment): scripts/lint/safe-lookup.mjs uses its
  # ALPHA JS-plugin API (#368). A bump that breaks the plugin fails scripts/lint/safe-lookup.test.mjs loudly in CI;
  # fix the plugin in that PR rather than merging the bump with the rules gone quiet.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # Every action in .github/workflows is pinned to a full commit SHA with a "# vX" comment (#279).
  # Dependabot recognises that form and bumps the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # The backend image's base (backend/Dockerfile) is pinned by digest (#561); Dependabot bumps the digest with the tag.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  # compose.yaml pins postgres and cloudflared by digest (#561). infra/aws/ holds the same pins (staging.tf, ecs.tf),
  # which Dependabot can't see: infra/aws/tests/static.test.mjs fails a bump until the PR copies it there too.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
