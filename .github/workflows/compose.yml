name: Compose stack

# ADR-0034 §3 (#406): compose.yaml boots. Builds the app and ops images from this commit, starts the
# stack without the `tunnel` profile (postgres, migrate, backend), checks that GET /api/health/ready
# answers 200 from inside the backend's network namespace (the backend listens on 127.0.0.1 only and
# publishes no port), runs a local-trial backup (#407: no bucket) and checks its encrypted dump, then
# removes the stack and its volumes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Pull requests boot the stack only when the backend, a workspace it bundles or compose.yaml changed, or the
    # setup did (scripts/ci-select.mjs). Pushes to main always run. Not a required check.
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read

  up:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.compose == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_IMAGE: compose/app:ci
      OPS_IMAGE: compose/ops:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Load the ops image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: ops
          platforms: linux/amd64
          load: true
          tags: compose/ops:ci
          cache-from: type=gha,scope=ops
      - name: Load the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: compose/app:ci
          cache-from: type=gha,scope=runtime
      - name: Write a throwaway .env
        run: |
          set -euo pipefail
          # The login settings are required to boot (ADR-0011); the hash is of a random password
          # nobody keeps, made by the ops image's own hash-password script.
          openssl rand -hex 24 > "$RUNNER_TEMP/pw"
          hash="$(docker run --rm -i "$OPS_IMAGE" npm run --silent hash-password -w backend < "$RUNNER_TEMP/pw")"
          rm -f "$RUNNER_TEMP/pw"
          postgres="$(openssl rand -hex 24)"
          migrator="$(openssl rand -hex 24)"
          app="$(openssl rand -hex 24)"
          session="$(openssl rand -base64 48)"
          backup="$(openssl rand -hex 24)"
          # A throwaway age key for the backup trial (#407): the private half stays in RUNNER_TEMP for the
          # decrypt check; readable by the ops image's node user, since it protects nothing.
          docker run --rm "$OPS_IMAGE" sh -c 'age-keygen 2>/dev/null' | grep '^AGE-SECRET-KEY-' > "$RUNNER_TEMP/age.key"
          chmod 644 "$RUNNER_TEMP/age.key"
          recipient="$(docker run --rm -i "$OPS_IMAGE" age-keygen -y < "$RUNNER_TEMP/age.key")"
          for secret in "$postgres" "$migrator" "$app" "$session" "$hash" "$backup" "$(cat "$RUNNER_TEMP/age.key")"; do echo "::add-mask::$secret"; done
          umask 077
          {
            echo "POSTGRES_PASSWORD=$postgres"
            echo "DB_MIGRATOR_PASSWORD=$migrator"
            echo "DB_APP_PASSWORD=$app"
            echo "DASHBOARD_ADMIN_USER=compose-ci"
            # Single quotes: the hash contains $, which compose would read as a variable.
            echo "DASHBOARD_ADMIN_PASSWORD_HASH='$hash'"
            echo "SESSION_SECRET=$session"
            echo "DB_BACKUP_PASSWORD=$backup"
            echo "BACKUP_AGE_RECIPIENT=$recipient"
          } > .env
      - name: docker compose up (no tunnel profile)
        run: docker compose up -d
      - name: /api/health/ready answers 200 inside the backend's namespace
        run: |
          set -euo pipefail
          probe="fetch('http://127.0.0.1:3001/api/health/ready').then(r=>{console.log(r.status);process.exit(r.status===200?0:1)},()=>{console.log('no answer');process.exit(1)})"
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if docker compose exec -T backend node -e "$probe"; then
              echo "ready after $((90 - (deadline - SECONDS))) s"
              exit 0
            fi
            sleep 3
          done
          echo "::error::/api/health/ready did not answer 200 within 90 s"
          exit 1
      - name: The backend publishes no port
        run: |
          set -euo pipefail
          published="$(docker compose ps -a --format json | jq -r 'select(any(.Publishers[]?; .PublishedPort != 0)) | .Service')"
          if [ -n "$published" ]; then
            echo "::error::these services publish a port: $published"
            exit 1
          fi
      - name: A local-trial backup writes an encrypted dump that decrypts to a pg_dump archive
        run: |
          set -euo pipefail
          # No BACKUP_S3_BUCKET: a local trial, nothing leaves the runner.
          docker compose run --rm -T backup
          docker compose run --rm -T -v "$RUNNER_TEMP/age.key:/tmp/age.key:ro" backup sh -c '
            set -eu
            set -- /var/backups/satis/satis-*.dump.age
            [ "$#" -eq 1 ] && [ -s "$1" ] || { echo "expected one encrypted dump, found: $*"; exit 1; }
            [ "$(head -c 21 "$1")" = "age-encryption.org/v1" ] || { echo "not an age file: $1"; exit 1; }
            age --decrypt --identity /tmp/age.key "$1" | pg_restore --list > /tmp/toc
            grep -q pgmigrations /tmp/toc || { echo "the dump lacks the migrations table"; exit 1; }
            echo "encrypted dump ok: $(basename "$1")"
          '
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: docker compose down -v
        if: always()
        run: |
          docker compose --profile backup down -v
          rm -f .env "$RUNNER_TEMP/age.key"
