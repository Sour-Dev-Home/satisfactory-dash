name: E2E

# Playwright end-to-end + visual + accessibility tests for the frontend (ADR-0016).
# Runs in the official Playwright image so screenshot baselines are pixel-stable:
# fonts and rendering differ per OS, so baselines are only ever generated HERE, never
# on a developer machine.
#
# Screenshot baselines (frontend/e2e/__screenshots__/):
# - None committed yet, or run manually with "update_snapshots": the job regenerates
#   them and uploads them as the `playwright-baselines` artifact. It stays green
#   (report-only for pixels); the frontend session downloads the artifact, reviews the
#   images, and commits them.
# - Committed: the job compares against them and fails on any visual diff.
# The functional tests (states render, the CSP-violation guard, unmocked-/api guard,
# production bundle checks) gate from day one either way.
#
# `e2e` can be a REQUIRED check: the workflow triggers on every PR (no `paths` filter,
# since a required check skipped by a path filter never reports and blocks the PR
# forever). The cheap `changes` job decides whether the heavy `e2e` job runs; when it
# doesn't, `e2e` is skipped by its `if:`, and a job skipped that way reports success.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate screenshot baselines and upload them as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must equal the @playwright/test version in package-lock.json; the first step checks it.
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did anything the e2e suite covers change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          # Manual runs, new branches (all-zero "before") or an unknown base: run everything.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(frontend/|packages/shared/|package-lock\.json$|\.github/workflows/e2e\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No frontend, shared, lockfile or e2e-workflow changes; e2e skipped (reports success)."
          fi

  e2e:
    needs: changes
    # Fail safe: if `changes` itself fails, run e2e anyway. Otherwise the skip would
    # report success and a broken detector would silently wave PRs through.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Pinned by tag AND digest (the multi-arch index digest), so a re-pushed tag can't
    # change what runs. To upgrade: bump PLAYWRIGHT_VERSION, the tag and the digest
    # together (the digest comes from the registry's Docker-Content-Digest header for
    # the new tag), then regenerate baselines.
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      CI: "true"
      PLAYWRIGHT_SNAPSHOTS: "1"
      # Passed via env, never interpolated into a script, so the pattern stays
      # injection-safe even if this input's type ever changes.
      UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the image matches the locked Playwright version
        run: |
          locked=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          if [ "$locked" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::package-lock.json has @playwright/test $locked but this workflow's image is $PLAYWRIGHT_VERSION. Bump PLAYWRIGHT_VERSION and the container tag together, then regenerate baselines."
            exit 1
          fi

      - run: npm ci

      - name: Decide whether to compare or regenerate screenshots
        id: mode
        run: |
          if [ "$UPDATE_SNAPSHOTS" = "true" ] || [ ! -d frontend/e2e/__screenshots__ ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Regenerating screenshot baselines (none committed yet, or a manual update). Pixels are report-only for this run."
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run e2e (compare against committed baselines)
        if: steps.mode.outputs.update == 'false'
        run: npm run e2e -w frontend

      - name: Run e2e (regenerate baselines)
        if: steps.mode.outputs.update == 'true'
        # `=all` rewrites every image; the default ("changed") skips diffs that fall
        # under the toHaveScreenshot tolerance, which silently kept stale baselines (#60).
        run: npm run e2e -w frontend -- --update-snapshots=all

      - name: Upload regenerated baselines
        if: steps.mode.outputs.update == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-baselines
          path: frontend/e2e/__screenshots__/
          if-no-files-found: error
          retention-days: 14

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
