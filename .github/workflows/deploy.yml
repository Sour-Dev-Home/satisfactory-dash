name: Deploy

# ADR-0049: staging, then the same digests to production.
#   automatic  after "Backend images" succeeds on a push to main: deploy that commit's images, if it published any
#   deploy     the images of `sha` (empty: the newest commit on main with published images): staging, then production
#   redeploy   the released digests on the current base (after a Terraform config change); no migration, no staging
#   rollback   the last good release, or the images of `sha`; no migration, no staging, no alarm pre-check
#
# Never add pull_request_target or workflow_call: the deploy roles trust this file on main, in the staging and
# production environments, and nothing else (infra/aws/deploy_iam.tf, staging.tf). Sessions never approve, reject or
# re-run this workflow's production runs (CLAUDE.md).

on:
  workflow_run:
    workflows: ["Backend images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: deploy, redeploy or rollback
        type: choice
        options: [deploy, redeploy, rollback]
        default: deploy
      sha:
        description: "Commit on main (40 hex). deploy: empty = newest with images. rollback: empty = the last good release."
        type: string
        required: false
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    # No AWS: the two digests, checked (linux/arm64, revision label = sha), used by every later job.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The automatic run only for a successful image run of a push to main in this repository (never a fork's).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      action: ${{ steps.a.outputs.action }}
      sha: ${{ steps.r.outputs.sha }}
      backend: ${{ steps.r.outputs.backend }}
      ops: ${{ steps.r.outputs.ops }}
      skip: ${{ steps.r.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 50
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - id: a
        env:
          ACTION: ${{ inputs.action || 'deploy' }}
        run: echo "action=$ACTION" >> "$GITHUB_OUTPUT"
      - id: r
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ steps.a.outputs.action }}
          SHA: ${{ inputs.sha }}
          # The commit the image run built, never github.sha (the newest on main).
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            node scripts/deploy/deploy.mjs resolve-auto "$RUN_SHA"
          elif [ "$ACTION" = "deploy" ] || [ -n "$SHA" ]; then
            node scripts/deploy/deploy.mjs resolve "$SHA"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Summary
        env:
          ACTION: ${{ steps.a.outputs.action }}
          SHA: ${{ steps.r.outputs.sha }}
          BACKEND: ${{ steps.r.outputs.backend }}
          OPS: ${{ steps.r.outputs.ops }}
          SKIP: ${{ steps.r.outputs.skip }}
        run: |
          {
            if [ "$SKIP" = "true" ]; then echo "### Nothing to deploy: ${SHA:0:8} published no backend images"; exit 0; fi
            echo "### $ACTION ${SHA:-(from the release record)}"
            if [ -n "$SHA" ]; then echo "- backend \`$BACKEND\`"; echo "- ops \`$OPS\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    # D4 step 2: every deploy (dispatched or automatic) passes staging before production.
    needs: resolve
    if: needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: staging-${{ github.run_id }}
          role-duration-seconds: 3600
          role-skip-session-tagging: true
      - name: staging
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          BACKEND: ${{ needs.resolve.outputs.backend }}
          OPS: ${{ needs.resolve.outputs.ops }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/deploy/deploy.mjs staging "$SHA" "$BACKEND" "$OPS"

  production:
    needs: [resolve, staging]
    # A deploy only after staging passed; redeploy and rollback ship images production already ran, so they skip it.
    if: >-
      always() && needs.resolve.result == 'success' && needs.resolve.outputs.skip != 'true' &&
      (needs.staging.result == 'success' || (needs.staging.result == 'skipped' && needs.resolve.outputs.action != 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Print the OIDC subject
        # Not a secret (ADR-0049 D1): the trust policy's StringEquals must match it exactly, case included.
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          payload="$(cut -d. -f2 <<< "$token" | tr '_-' '/+')"
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          echo "sub: $(base64 -d <<< "$payload" | jq -r .sub)"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          # The trust policy allows AssumeRoleWithWebIdentity only, not sts:TagSession.
          role-skip-session-tagging: true
      - name: ${{ needs.resolve.outputs.action }}
        env:
          ACTION: ${{ needs.resolve.outputs.action }}
          SHA: ${{ needs.resolve.outputs.sha }}
          BACKEND: ${{ needs.resolve.outputs.backend }}
          OPS: ${{ needs.resolve.outputs.ops }}
          DEPLOY_DISCORD_WEBHOOK: ${{ secrets.DEPLOY_DISCORD_WEBHOOK }}
        run: node scripts/deploy/deploy.mjs production "$ACTION" "$SHA" "$BACKEND" "$OPS"
