name: Demo video

# ADR-0026: records the ~65 s demo walkthrough (`npm run demo:video -w frontend`) against the
# built demo site and uploads walkthrough.mp4 + poster.png (1200x630, the og:image) as the
# `demo-video` artifact. Manual only: run it when the UI changes, then publish the files to
# the portfolio and a release asset by hand.
#
# Runs in the same digest-pinned Playwright image as e2e.yml, so fonts and rendering match
# the screenshot baselines. ffmpeg (for the H.264 MP4) is installed from the image's Ubuntu
# archive; the encode script skips the MP4 silently without it, so the upload below lists the
# MP4 explicitly and fails if it's missing.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-video
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - run: npm ci

      - name: Record the walkthrough
        run: npm run demo:video -w frontend

      # Locally the script SKIPS the MP4 without ffmpeg; in CI that must be a failure.
      - name: Verify the outputs
        working-directory: frontend/demo-video
        run: |
          for f in walkthrough.mp4 poster.png; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty"; exit 1; }
          done
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 walkthrough.mp4)
          size=$(stat -c %s walkthrough.mp4)
          echo "duration=${duration}s size=${size} bytes"
          # 60-90 s per ADR-0026.
          awk -v d="$duration" 'BEGIN { exit !(d >= 60 && d <= 90) }' \
            || { echo "::error::walkthrough.mp4 is ${duration}s, outside 60-90 s"; exit 1; }
          # Workers static assets: 25 MiB per file (Free plan), since the landing page self-hosts it.
          [ "$size" -lt $((25 * 1024 * 1024)) ] \
            || { echo "::error::walkthrough.mp4 is ${size} bytes, over the 25 MiB Workers asset limit"; exit 1; }

      - name: Upload the video and poster
        uses: actions/upload-artifact@v7
        with:
          name: demo-video
          path: |
            frontend/demo-video/walkthrough.mp4
            frontend/demo-video/poster.png
          if-no-files-found: error
          retention-days: 30
