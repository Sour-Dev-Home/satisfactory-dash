name: Terraform

# ADR-0034 (#405): checks infra/aws/ without touching AWS. fmt, validate, tflint (with the AWS ruleset),
# `terraform test` against a mock provider, and the static checks in infra/aws/tests/. No AWS
# credentials exist here and nothing plans or applies against the real account; the owner applies by hand.

on:
  push:
    branches: [main]
    paths:
      - 'infra/aws/**'
      - '.github/workflows/terraform.yml'
      - 'compose.yaml'
  pull_request:
    paths:
      - 'infra/aws/**'
      - '.github/workflows/terraform.yml'
      # The static checks compare infra/aws/'s image pins with compose.yaml's, so a compose-only bump runs them (#561).
      - 'compose.yaml'

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
      # -backend=false: no state bucket and no credentials are needed to validate or test.
      - name: init
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=bootstrap init -backend=false -input=false -lockfile=readonly
      - name: validate
        run: |
          terraform validate
          terraform -chdir=bootstrap validate
      - name: terraform test (mock provider)
        run: |
          terraform test
          terraform -chdir=bootstrap test
      - name: static checks
        run: node --test tests/static.test.mjs
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: tflint
        env:
          # Read-only, for the plugin download's rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format=compact
