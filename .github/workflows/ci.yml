name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DEBUG check for PII or hardcoded local paths
        run: |
          FILES=$(git ls-files | grep -v '^\.github/' || true)
          FILE_COUNT=$(echo "$FILES" | wc -l)
          echo "::warning::DEBUG file count searched: $FILE_COUNT"
          MATCHES=$(echo "$FILES" | xargs -r grep -n -iE "leonardo|nunez|leonunez9821|470.535.7258|C:\\\\Users|C:/Users" || true)
          ENCODED=$(echo "$MATCHES" | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::warning::DEBUG matches: [${ENCODED}]"
          if [ -n "$MATCHES" ]; then
            echo "::error::Found a possible PII or hardcoded-path leak — see CLAUDE.md ground rule 7."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
