name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for PII or hardcoded local paths
        # The identifiers to look for live in the PII_PATTERNS repo variable (one fixed
        # string per line), not in this public file, and only file:line is printed, so
        # neither the workflow nor its logs publish what they protect.
        env:
          PII_PATTERNS: ${{ vars.PII_PATTERNS }}
        run: |
          PATTERNS=$(mktemp)
          printf '%s\n' "$PII_PATTERNS" | sed '/^[[:space:]]*$/d' > "$PATTERNS"
          printf '%s\n' 'C:\Users' 'C:/Users' '/home/' '/Users/' >> "$PATTERNS"
          if [ -z "$PII_PATTERNS" ]; then
            echo "::warning::PII_PATTERNS variable is not set (e.g. a fork PR); only checking for local paths."
          fi
          # This file and CLAUDE.md files (which document the path patterns as examples of
          # what NOT to commit) are excluded.
          HITS=$(git ls-files | grep -vE '^(\.github/|.*CLAUDE\.md$)' | xargs -r grep -n -iF -f "$PATTERNS" | cut -d: -f1,2 || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Possible PII or hardcoded-path leak at the file:line locations above (see CLAUDE.md ground rule 7)."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
