name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for PII or hardcoded local paths
        run: |
          # CLAUDE.md files legitimately document these patterns as examples of what
          # NOT to commit, and this file itself has to contain the pattern strings to
          # check for them — both are excluded, not searched for real leaks.
          EXCLUDE='^(\.github/|.*CLAUDE\.md$)'
          FILES=$(git ls-files | grep -vE "$EXCLUDE" || true)
          NAMES=$(echo "$FILES" | xargs -r grep -n -iF -e 'leonardo' -e 'nunez' -e 'leonunez9821' -e 'C:\Users' -e 'C:/Users' || true)
          PHONE=$(echo "$FILES" | xargs -r grep -n -E '470.535.7258' || true)
          if [ -n "$NAMES" ] || [ -n "$PHONE" ]; then
            echo "$NAMES"
            echo "$PHONE"
            echo "::error::Found a possible PII or hardcoded-path leak — see CLAUDE.md ground rule 7."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  fresh-eyes-review:
    # Independent, automated pass by an agent that never saw the implementation get
    # written — the same principle as the test-hunter agent, but as a guaranteed CI
    # step instead of something that has to be manually remembered. Opt-in: does
    # nothing unless the ANTHROPIC_API_KEY secret is set (see CLAUDE.md). Advisory
    # only — never fails the build, never blocks merging, just posts a PR comment.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for backend changes
        id: check
        run: |
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          CHANGED=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD -- backend/src/ || true)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$CHANGED" > /tmp/changed-files.txt
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.check.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Independent fresh-eyes review
        if: steps.check.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret not set - skipping automated fresh-eyes review. This is opt-in; see CLAUDE.md for setup."
            exit 0
          fi

          npm ci
          npm install -g @anthropic-ai/claude-code

          # Agent defined inline (not a repo file) so this never depends on custom-agent
          # discovery timing - the exact issue that caused real confusion in this
          # project's local development (see CLAUDE.md).
          cat > /tmp/agent.json <<'AGENTJSON'
          {
            "test-hunter": {
              "description": "Independent bug-hunting and test-writing agent",
              "prompt": "You review code changes for bugs and test coverage, deliberately with no memory of why the code was written a certain way - probe it, don't reconstruct its reasoning charitably. Process: (1) find the contract first (types, README, docs-vault) before reading the implementation body; (2) write tests against that contract alone, before reading implementation internals; (3) run those tests against the real implementation - a failure is a finding, not necessarily a mistake in your test; (4) then read the implementation and hunt for bugs: unhandled error paths, boundary/off-by-one bugs, assumptions that do not match docs-vault-verified reality, missing validation on data from outside the process; (5) write tests for anything found in step 4; (6) report clearly what you tested, what passed, what failed and why, and what you could not test and why. Hard rules: never edit implementation source files, only test files; never weaken a test to make it pass; ground any claim about the Satisfactory dedicated-server or FicsitRemoteMonitoring APIs in docs-vault/, not assumption."
            }
          }
          AGENTJSON

          CHANGED_FILES=$(cat /tmp/changed-files.txt)
          RESULT=$(claude -p "Review this pull request's backend changes with fresh eyes. Changed files under backend/src/:
          $CHANGED_FILES

          This is an npm workspaces monorepo - backend commands need -w backend, e.g. npm run test -w backend, npm run typecheck -w backend. Follow your process and report findings." \
            --agent test-hunter \
            --agents "$(cat /tmp/agent.json)" \
            --allowedTools "Read,Grep,Glob,Bash,Edit,Write" \
            --permission-mode bypassPermissions \
            --max-budget-usd 2 \
            --output-format text \
            --no-session-persistence 2>&1) || true

          {
            echo "## Independent fresh-eyes review"
            echo ""
            echo "$RESULT"
            echo ""
            echo "---"
            echo "*Automated review from a context that never saw this code get written - not a required check, use your judgment on findings.*"
          } > /tmp/review-comment.md

          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/review-comment.md
