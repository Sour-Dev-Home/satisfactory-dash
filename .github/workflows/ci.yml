name: CI

on:
  push:
    branches: [main]
  pull_request:
  # ADR-0033: the merge queue runs these checks on its own commit (main plus the queued PRs). Harmless until a
  # queue is enabled. The log fragment step below runs on pull_request only.
  merge_group:
    types: [checks_requested]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Log fragment (ADR-0033)
        # Pull requests only (not push or merge_group): the PR must ADD its own file under
        # docs-vault/wiki/log.d/ and must not edit log.md or an existing fragment. The label
        # `log-compaction` and the Dependabot author are exempt. Labels are read live so a re-run
        # after adding the label sees it. Values reach the script through env, never a shell line.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          PR_FILES_JSON=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | {filename, status, previous_filename}' | jq -s .)
          PR_LABELS_JSON=$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '[.[].name]')
          export PR_FILES_JSON PR_LABELS_JSON
          node scripts/log-check.mjs

      - name: UI tier (ADR-0033 amendment 3)
        # Pull requests only. A PR labelled `tier:ui` skips the architect's review, so this decides whether it really is
        # one: every changed file must be in the UI-tier paths and no added line under frontend/src may match the
        # data-flow pattern. Without the label nothing is checked. Labels are read live, so a re-run after adding the
        # label sees it. The files (with their patches, which can be large) go through a file, not a variable.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          PR_LABELS_JSON=$(gh api "repos/$REPO/issues/$PR_NUMBER/labels?per_page=100" --jq '[.[].name]')
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | {filename, status, previous_filename, patch, changes}' | jq -s . > "$RUNNER_TEMP/pr-files.json"
          export PR_LABELS_JSON PR_FILES_FILE="$RUNNER_TEMP/pr-files.json"
          node scripts/tier-check.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for PII or hardcoded local paths
        # The identifiers to look for live in the PII_PATTERNS repo SECRET (one fixed
        # string per line), not in this public file, and only file:line is printed. It must
        # be a secret, never a variable: Actions prints a step's `env:` block at the top of
        # its log, and only secrets are masked there (a variable published the patterns in
        # every run's log). Fork and Dependabot runs may not get it; see the warning below.
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: |
          PATTERNS=$(mktemp)
          printf '%s\n' "$PII_PATTERNS" | sed '/^[[:space:]]*$/d' > "$PATTERNS"
          printf '%s\n' 'C:\Users' 'C:/Users' '/home/' '/Users/' >> "$PATTERNS"
          if [ -z "$PII_PATTERNS" ]; then
            echo "::warning::PII_PATTERNS secret is not available (e.g. a fork PR); only checking for local paths."
          fi
          # This file and CLAUDE.md files (which document the path patterns as examples of
          # what NOT to commit) are excluded. LICENSE deliberately names the copyright holder
          # (ADR-0018), so exactly that file is excluded too, and so is exactly the privacy
          # page, which names the owner as data controller (decided 2026-09-24; the terms
          # page never carries the name and stays scanned). -H is required: with a single
          # file grep omits the filename, and `cut -f1,2` would then keep the matched text
          # and print it.
          HITS=$(git ls-files | grep -vE '^(\.github/|.*CLAUDE\.md$|LICENSE$|frontend/public/privacy\.html$)' | xargs -r grep -H -n -iF -f "$PATTERNS" | cut -d: -f1,2 || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Possible PII or hardcoded-path leak at the file:line locations above (see CLAUDE.md ground rule 7)."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
