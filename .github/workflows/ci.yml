name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for PII or hardcoded local paths
        # The identifiers to look for live in the PII_PATTERNS repo SECRET (one fixed
        # string per line), not in this public file, and only file:line is printed. It must
        # be a secret, never a variable: Actions prints a step's `env:` block at the top of
        # its log, and only secrets are masked there (a variable published the patterns in
        # every run's log). Fork and Dependabot runs may not get it; see the warning below.
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: |
          PATTERNS=$(mktemp)
          printf '%s\n' "$PII_PATTERNS" | sed '/^[[:space:]]*$/d' > "$PATTERNS"
          printf '%s\n' 'C:\Users' 'C:/Users' '/home/' '/Users/' >> "$PATTERNS"
          if [ -z "$PII_PATTERNS" ]; then
            echo "::warning::PII_PATTERNS secret is not available (e.g. a fork PR); only checking for local paths."
          fi
          # This file and CLAUDE.md files (which document the path patterns as examples of
          # what NOT to commit) are excluded. LICENSE deliberately names the copyright holder
          # (ADR-0018), so exactly that file is excluded too. -H is required: with a single
          # file grep omits the filename, and `cut -f1,2` would then keep the matched text
          # and print it.
          HITS=$(git ls-files | grep -vE '^(\.github/|.*CLAUDE\.md$|LICENSE$)' | xargs -r grep -H -n -iF -f "$PATTERNS" | cut -d: -f1,2 || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Possible PII or hardcoded-path leak at the file:line locations above (see CLAUDE.md ground rule 7)."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
