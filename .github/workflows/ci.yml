name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for PII or hardcoded local paths
        run: |
          MATCHES=$(git grep -n -iE "leonardo|nunez|leonunez9821|470.535.7258|C:\\\\Users|C:/Users" -- . | grep -v '^\.github/workflows/ci\.yml:' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::Found a possible PII or hardcoded-path leak — see CLAUDE.md ground rule 7."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
