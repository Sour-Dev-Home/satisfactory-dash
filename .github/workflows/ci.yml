name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    # What this change has to build and test (scripts/ci-select.mjs). Pushes to main run everything.
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read

  verify:
    needs: changes
    # A required check, so it always runs and always reports: the log-fragment check and the script tests apply
    # to every PR, and the workspace steps run for the selected workspaces only. If `changes` failed, ALL is true.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      ALL: ${{ needs.changes.result != 'success' || needs.changes.outputs.all == 'true' }}
      WORKSPACES: ${{ needs.changes.outputs.workspaces }}
      SERVER_MANAGER: ${{ needs.changes.outputs.server_manager }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log fragment (ADR-0033)
        # Pull requests only (not push): the PR must ADD its own file under
        # docs-vault/wiki/log.d/ and must not edit log.md or an existing fragment. The label
        # `log-compaction` and the Dependabot author are exempt. Labels are read live so a re-run
        # after adding the label sees it. Values reach the script through env, never a shell line.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          PR_FILES_JSON=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | {filename, status, previous_filename}' | jq -s .)
          PR_LABELS_JSON=$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '[.[].name]')
          export PR_FILES_JSON PR_LABELS_JSON
          node scripts/log-check.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migration contract check (ADR-0049 D6)
        run: node scripts/migration-contract-check.mjs

      - run: npm run lint
        if: env.ALL == 'true'

      - run: npm run typecheck
        if: env.ALL == 'true'

      - run: npm run test
        if: env.ALL == 'true'

      - run: npm run build
        if: env.ALL == 'true'

      - name: Lint, typecheck, test and build the selected workspaces
        if: env.ALL != 'true'
        run: |
          set -euo pipefail
          echo "Selected workspaces: ${WORKSPACES:-none}"
          for ws in $WORKSPACES; do
            echo "::group::$ws"
            npm run lint -w "$ws"
            npm run typecheck -w "$ws"
            npm run test -w "$ws"
            npm run build -w "$ws" --if-present
            echo "::endgroup::"
          done
          npm run test:scripts

      # The server manager's Playwright suite drives the real Electron app (ADR-0040), so it needs a display.
      # Ubuntu's AppArmor blocks Chromium's user-namespace sandbox unless unprivileged namespaces are allowed.
      - name: Server manager e2e
        if: env.ALL == 'true' || env.SERVER_MANAGER == 'true'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run e2e -w server-manager

  load-smoke:
    # ADR-0037 build step 5 (#448): scenario (a) of the k6 load kit, shortened to about a minute, against a `satis_load`
    # database on this job's own Postgres. Report-only: k6's exit 99 (a threshold crossed) never fails the job, and the
    # report goes to the job summary and an artifact. A broken kit (database setup, backend boot, seed, k6 script or
    # report) does fail it. Runbook: docs-vault/wiki/runbooks/load-testing.md.
    # Runs when the backend or the load kit changed (not a required check, so a skip blocks nothing).
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.load == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          # A throwaway superuser for this job's own container; nothing else can reach it.
          POSTGRES_PASSWORD: load-smoke-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: "2.3.0"

      - name: Generate throwaway credentials
        run: |
          set -euo pipefail
          migrator="$(openssl rand -hex 24)"
          app="$(openssl rand -hex 24)"
          session="$(openssl rand -base64 48)"
          openssl rand -hex 24 > "$RUNNER_TEMP/pw"
          hash="$(npm run --silent hash-password -w backend < "$RUNNER_TEMP/pw")"
          rm -f "$RUNNER_TEMP/pw"
          for secret in "$migrator" "$app" "$session" "$hash"; do echo "::add-mask::$secret"; done
          {
            echo "DB_MIGRATOR_PASSWORD=$migrator"
            echo "DB_APP_PASSWORD=$app"
            echo "SESSION_SECRET=$session"
            echo "DASHBOARD_ADMIN_PASSWORD_HASH=$hash"
            echo "DATABASE_URL=postgres://satis_app:$app@127.0.0.1:5432/satis_load"
          } >> "$GITHUB_ENV"

      - name: Create and migrate the satis_load database
        env:
          DATABASE_ADMIN_URL: postgres://postgres:load-smoke-only-not-a-secret@127.0.0.1:5432/postgres
          DB_NAME: satis_load
        run: |
          set -euo pipefail
          npm run db:init -w backend
          MIGRATOR_DATABASE_URL="postgres://satis_migrator:${DB_MIGRATOR_PASSWORD}@127.0.0.1:5432/satis_load" npm run db:migrate -w backend

      - name: Start the backend on the load database
        env:
          HOST: 127.0.0.1
          DASHBOARD_ADMIN_USER: load-smoke
        run: |
          set -euo pipefail
          npm run build -w backend
          nohup node backend/dist/server.cjs > "$RUNNER_TEMP/backend.log" 2>&1 &
          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/health/ready || true)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          echo "::error::/api/health/ready did not answer 200 within 60 s (last: $code)"
          exit 1

      - name: Seed
        env:
          LOAD_TEST: "1"
        run: npx tsx backend/scripts/load-seed.ts --servers 1 --users 3

      - name: Scenario (a), smoke length
        run: |
          set -uo pipefail
          echo "LOAD_SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          mkdir -p load/results
          k6 run --quiet --env SMOKE=1 --out json=load/results/a.json load/a-baseline.js
          status=$?
          echo "LOAD_UNTIL=$(date -u -d '+1 second' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          if [ "$status" -eq 99 ]; then
            echo "::notice::k6 crossed a threshold (report-only, ADR-0037)."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Report
        env:
          LOAD_TEST: "1"
        run: |
          set -euo pipefail
          # The backend adds its metrics to metrics.series_hourly every 60 s; wait for the flush after the run.
          sleep 70
          node scripts/load-report.mjs --summary load/results/a.json --since "$LOAD_SINCE" --until "$LOAD_UNTIL" \
            --scenario a --target http://127.0.0.1:3001 --out-dir "$RUNNER_TEMP/perf"
          cat "$RUNNER_TEMP"/perf/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: load-smoke-report
          path: ${{ runner.temp }}/perf/
          if-no-files-found: ignore
          retention-days: 14

      - name: Backend log on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/backend.log" || true

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check for PII or hardcoded local paths
        # The identifiers to look for live in the PII_PATTERNS repo SECRET (one fixed
        # string per line), not in this public file, and only file:line is printed. It must
        # be a secret, never a variable: Actions prints a step's `env:` block at the top of
        # its log, and only secrets are masked there (a variable published the patterns in
        # every run's log). Fork and Dependabot runs may not get it; see the warning below.
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: |
          PII=$(mktemp)
          PATHS=$(mktemp)
          FILES=$(mktemp)
          printf '%s\n' "$PII_PATTERNS" | sed '/^[[:space:]]*$/d' > "$PII"
          printf '%s\n' 'C:\Users' 'C:/Users' '/home/' '/Users/' > "$PATHS"
          if [ -z "$PII_PATTERNS" ]; then
            echo "::warning::PII_PATTERNS secret is not available (e.g. a fork PR); only checking for local paths."
          fi
          # This file and CLAUDE.md files (which document the path patterns as examples of
          # what NOT to commit) are excluded. LICENSE deliberately names the copyright holder
          # (ADR-0018), so exactly that file is excluded too, and so is exactly the privacy
          # page, which names the owner as data controller (decided 2026-09-24; the terms
          # page never carries the name and stays scanned). -H is required: with a single
          # file grep omits the filename, and `cut -f1,2` would then keep the matched text
          # and print it. The vendored OWASP cheat sheets (third-party text) quote URLs
          # and code such as `/home/` and `/users/`, so they skip the path patterns only; the
          # PII patterns still scan them.
          git ls-files -z | grep -zvE '^(\.github/|.*CLAUDE\.md$|LICENSE$|frontend/public/privacy\.html$)' > "$FILES" || true
          PII_HITS=$(xargs -0 -r grep -H -n -iF -f "$PII" < "$FILES" | cut -d: -f1,2 || true)
          PATH_HITS=$(grep -zvE '^vendor/owasp-cheatsheets/sheets/' "$FILES" | xargs -0 -r grep -H -n -iF -f "$PATHS" | cut -d: -f1,2 || true)
          HITS=$(printf '%s\n%s\n' "$PII_HITS" "$PATH_HITS" | sed '/^$/d' | sort -u)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Possible PII or hardcoded-path leak at the file:line locations above (see CLAUDE.md ground rule 7)."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
