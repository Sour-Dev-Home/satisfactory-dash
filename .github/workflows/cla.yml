name: CLA

# Asks outside contributors to sign CLA.md by commenting on their first pull request and
# records the signature in signatures/cla.json on the `cla-signatures` branch (never on main).
#
# SECURITY: `pull_request_target` runs with a write token in the context of the base branch,
# so this job must NEVER check out or run code from the pull request. It doesn't: the only
# step is the pinned action below, which reads the PR's metadata through the GitHub API.
# The action is pinned to a full commit SHA (v2.6.1); Dependabot's github-actions ecosystem
# proposes updates.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # commits to the signatures branch only
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          # The maintainer account and bots that never need to sign live in the CLA_ALLOWLIST
          # repository variable (comma separated), not in this public file.
          allowlist: ${{ vars.CLA_ALLOWLIST }}
          lock-pullrequest-aftermerge: false
